[project]
name = "cotp_indexer"
version = "0.0.1"
description = "Indexer for COTP contracts, launched tokens and Ekubo pools"
license = { text = "MIT" }
authors = [
    { name = "Michael Zaikin", email = "michael.zaikin@starkware.co" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dipdup==8.1.3"
]

[tool.pdm.dev-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
]

[tool.black]
line-length = 120
target-version = ['py312']
skip-string-normalization = true
extend-exclude = "cotp_indexer"

[tool.ruff]
line-length = 120
target-version = 'py312'

[tool.ruff.lint]
extend-select = ["B", "C4", "FA", "G", "I", "PTH", "Q", "RET", "RUF", "TCH", "UP"]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
isort = { force-single-line = true}

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
exclude = "cotp_indexer"

[[tool.mypy.overrides]]
module = "ruamel"
ignore_missing_imports = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"