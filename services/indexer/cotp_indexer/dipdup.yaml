spec_version: 3.0
package: cotp_indexer

logging: INFO

database:
  kind: postgres
  host: ${POSTGRES_HOST:-localhost}
  port: ${POSTGRES_PORT:-5432}
  user: ${POSTGRES_USER:-dipdup}
  password: ${POSTGRES_PASSWORD:-dipdup}
  database: ${POSTGRES_DB:-dipdup}

datasources:
  subsquid:
    kind: starknet.subsquid
    url: ${SUBSQUID_URL:-https://v2.archive.subsquid.io/network/starknet-sepolia}
  node:
    kind: starknet.node
    url: ${NODE_URL:-https://starknet-sepolia.g.alchemy.com/starknet/version/rpc/v0_7/6e6ntRee9DYgQFYqVffLB}
    http:
      ratelimit_rate: 3
      ratelimit_period: 1
      ratelimit_sleep: 1

contracts:
  factory:
    kind: starknet
    address: '${FACTORY_CONTRACT_ADDRESS:-0x0135abb443cbba9738fe63d55a06810fdf14b605ddc5262220a889411baede25}'
    typename: factory
  swap:
    kind: starknet
    address: '${SWAP_CONTRACT_ADDRESS:-0x07a6c0500a1596c0a501156ba660c84c461a599053ab96319d61dfc2626a45b9}'
    typename: swap
  token:
    kind: starknet
    address: '${TOKEN_TEMPLATE_ADDRESS:-0x051edfc985b303c7517e1daadd972b8edbe4bfd8484edc6f9a810704c0931975}'
    typename: token
  # pool:
  #   kind: starknet
  #   address: '0x6ad3a7546129bd91394330516ece313aedf3f1df262f12e80bd7b4ce493f8c6'
  #   typename: pool

indexes:
  factory_events:
    kind: starknet.events
    first_level: ${INDEXER_FIRST_LEVEL:-0}
    datasources:
      - subsquid
      - node
    handlers:
      - callback: on_token_launched
        contract: factory
        name: ShitcoinLaunched
  swap_events:
    kind: starknet.events
    first_level: ${INDEXER_FIRST_LEVEL:-0}
    datasources:
      - subsquid
      - node
    handlers:
      - callback: on_token_bought
        contract: swap
        name: TokenBought
      - callback: on_token_sold
        contract: swap
        name: TokenSold
      - callback: on_strk_price_updated
        contract: swap
        name: StrkPriceUpdated
      - callback: on_pool_launched
        contract: swap
        name: PoolLaunched
  #
  # ---- For code generation only ----
  #
  # token_events_init:
  #   template: token_events
  #   values:
  #     contract: token

templates:
  token_events:
    kind: starknet.events
    first_level: ${INDEXER_FIRST_LEVEL:-0}
    datasources:
      - subsquid
      - node
    handlers:
      - callback: on_token_transferred
        contract: <contract>
        name: Transfer
