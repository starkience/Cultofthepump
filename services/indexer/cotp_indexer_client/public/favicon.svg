<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" fill="black"/>
  <!-- Glow effect background -->
  <path d="M6 8 L22 8 L24 10 L24 12 L12 12 L10 14 L10 18 L12 20 L24 20 L24 22 L22 24 L6 24 L4 22 L4 10 Z" 
        fill="#0f0" opacity="0.3" filter="url(#glow)"/>
  <!-- Main shape -->
  <path d="M8 8 L22 8 L24 10 L24 12 L12 12 L10 14 L10 18 L12 20 L24 20 L24 22 L22 24 L8 24 L6 22 L6 10 Z" 
        fill="#0f0" filter="url(#glow)"/>
  <!-- Highlight lines -->
  <path d="M8 8 L22 8 M24 12 L12 12 M10 14 L10 18 M12 20 L24 20" 
        stroke="#fff" stroke-width="0.5" opacity="0.5"/>
</svg> 