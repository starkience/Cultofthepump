[package]
name = "onchain"
version = "0.1.0"
edition = "2024_07"

# See more keys and their definitions at https://docs.swmansion.com/scarb/docs/reference/manifest.html

[dependencies]
starknet = "2.8.4"
cubit = { git = "https://github.com/dojoengine/cubit", branch = "cairo_2.7" }
openzeppelin = { git = "https://github.com/OpenZeppelin/cairo-contracts", branch = "release-v0.19.0" }
openzeppelin_presets = { git = "https://github.com/OpenZeppelin/cairo-contracts", branch = "release-v0.19.0" }

[dev-dependencies]
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry", tag = "v0.33.0" }
assert_macros = "2.8.4"

[[target.starknet-contract]]
sierra = true
build-external-contracts = ["openzeppelin_presets::erc20::ERC20Upgradeable"]

[tool.fmt]
sort-module-level-items = true

[scripts]
test = "snforge test"
